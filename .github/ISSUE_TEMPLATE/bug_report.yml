name: Bug report
description: Report a reproducible problem in Office Image Extractor
title: "[Bug] "
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What happened and what did you expect?
    validations:
      required: true
  - type: input
    id: browser
    attributes:
      label: Browser / OS
      placeholder: Chrome 151 / Windows 11
  - type: input
    id: format
    attributes:
      label: Office file type
      placeholder: .xlsx / .pptx / .docx
  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction steps
      description: Do not attach confidential Office documents.
