name: Validate standalone HTML

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - "src/**"
      - "scripts/**"
      - "tests/**"
      - "app.config.json"
      - "dependencies.json"
      - "build-standalone.ps1"
      - "build-standalone.bat"
      - ".github/workflows/build-standalone.yml"

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
      - name: Build and verify standalone HTML
        shell: pwsh
        run: ./scripts/check-repository.ps1
      - name: Upload standalone artifact
        uses: actions/upload-artifact@v7
        with:
          name: standalone-html-${{ github.event.pull_request.head.sha || github.sha }}
          path: |
            dist/index.html
            dist/office-image-extractor.html
            dist/index.self-extract.html
            dist/dependency-manifest.json
            dist/self-extract-manifest.json
            dist/.nojekyll
          if-no-files-found: error
          retention-days: 14

  browser-qa:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v7
        with:
          node-version: lts/*
      - uses: actions/download-artifact@v7
        with:
          name: standalone-html-${{ github.event.pull_request.head.sha || github.sha }}
          path: dist
      - name: Install pinned browser test runner
        run: |
          npm install --prefix .cache/browser --no-save --ignore-scripts playwright@1.64.1
          .cache/browser/node_modules/.bin/playwright install --with-deps chromium
      - name: Test standalone files in Chromium
        env:
          PLAYWRIGHT_MODULE: ../.cache/browser/node_modules/playwright
        run: node tests/browser-qa.cjs
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: office-browser-qa-${{ github.event.pull_request.head.sha || github.sha }}
          path: browser-qa
          if-no-files-found: warn
